<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Notes Manager</title>
<style>
  :root {
    --accent:      #5b4bff;
    --accent-dk:   #4a3ae8;
    --accent-lt:   #f0edff;
    --ink:         #0c0c0e;
    --ink-2:       #1c1c22;
    --muted:       #6b7280;
    --muted-2:     #9ca3af;
    --border:      #e4e4e8;
    --border-2:    #d1d1d8;
    --bg:          #f7f7f9;
    --surface:     #ffffff;
    --surface-2:   #f4f4f7;
    --r:           12px;
    --r-lg:        14px;
    --sh:          0 1px 2px rgba(0,0,0,0.04), 0 1px 1px rgba(0,0,0,0.03);
    --sh-hover:    0 6px 18px rgba(20,20,30,0.08), 0 1px 3px rgba(20,20,30,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; user-select: none; }

  /* ─── Toolbar ─────────────────────────────────────────── */
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
  }

  .search-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap svg {
    position: absolute;
    left: 11px;
    color: var(--muted-2);
    pointer-events: none;
  }
  #search {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 12px 8px 32px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #search::placeholder { color: var(--muted-2); }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-lt);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    white-space: nowrap;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: var(--accent-dk); }
  .btn:active { transform: scale(0.97); }

  /* ─── List ────────────────────────────────────────────── */
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 100%;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 24px;
    line-height: 1.55;
  }
  .empty svg { color: var(--border-2); }

  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--r-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--sh);
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .card:hover {
    box-shadow: var(--sh-hover);
    border-color: var(--border-2);
  }

  .swatch {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    flex: 0 0 auto;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  }

  .info { flex: 1; min-width: 0; }
  .title {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    font-family: inherit;
    padding: 2px 4px;
    margin: -2px -4px 1px;
    border-radius: 5px;
  }
  .title:hover { background: var(--surface-2); }
  .title:focus { background: var(--accent-lt); }
  .snippet {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta {
    font-size: 11px;
    color: var(--muted-2);
    margin-top: 3px;
  }

  .status {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 3px 8px;
    border-radius: 5px;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .status.visible { color: var(--accent-dk); }
  .status.hidden { color: var(--muted-2); }

  .actions { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    cursor: pointer;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    color: var(--muted);
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.danger { color: #d3392e; }
  .icon-btn.danger:hover { background: #fdecec; color: #a9241b; }
  .actions-divider {
    width: 1px;
    height: 18px;
    background: var(--border);
    margin: 0 4px;
    flex: 0 0 auto;
  }

  #version {
    flex: 0 0 auto;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--muted-2);
    text-align: center;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  /* ─── Modal ────────────────────────────────────────────── */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { display: flex; opacity: 1; }
  .modal {
    background: var(--surface);
    border-radius: 12px;
    width: 300px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    transform: scale(0.95);
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal h3 { margin-bottom: 10px; font-size: 16px; color: var(--ink); }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.4; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .modal-actions .btn { flex: 1; justify-content: center; }
  .modal-actions .btn.cancel { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); }
  .modal-actions .btn.cancel:hover { background: var(--border); }
  .modal-actions .btn.danger { background: #d3392e; color: #fff; }
  .modal-actions .btn.danger:hover { background: #a9241b; }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search notes…" />
    </div>
    <button class="btn" id="newNote">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New
    </button>
  </div>
  <div class="list" id="list"></div>
  <div id="version"></div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>Delete Note</h3>
      <p>Are you sure you want to delete this note permanently? This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn cancel" id="cancelDeleteBtn">Cancel</button>
        <button class="btn danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="manager-renderer.js"></script>
</body>
</html>
